server {
    listen 80;
    listen [::]:80;
    server_name <SERVER_HOSTNAME>;

    root /var/www/haytravel;
    index index.html;

    location /api/ {
        # Default nginx limit (1m) rejects real photo uploads (api/Upload/Image) before they
        # reach the backend's own 10MB check — see docs/server-ops.md.
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:5253/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные изображения — раздаются напрямую с диска, минуя .NET (тот же приём, что и
    # для фронтенд-статики выше). Путь совпадает с bind-mount backend-контейнера в
    # docker-compose.yml (./uploads:/app/uploads => /opt/haytravel/uploads на хосте).
    location /uploads/ {
        alias /opt/haytravel/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
