<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallbacks: SVG favicons aren't honoured by Safari or by most social/messenger link
         crawlers, which is why the tab/search icon looked broken even though favicon.svg itself
         served fine. `sizes` on the 32px PNG lets browsers that support both prefer the crisper
         SVG while still resolving a concrete rel="icon" for anything that doesn't. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` lets the page draw under the iOS notch/Dynamic Island/home-indicator
         instead of Safari auto-reserving that space — required for `env(safe-area-inset-*)` to
         report real values anywhere in the app (Header's top padding, MobileTabBar's bottom
         padding). Without it those env() calls always resolve to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Шрифты подключены здесь, а не через `@import` в index.css, намеренно: `@import` внутри
         CSS сериализует загрузку (браузер сначала должен скачать и распарсить index.css, только
         потом обнаружит запрос к fonts.googleapis.com, и лишь потом дойдёт до самих файлов
         шрифтов). Для дисплейной гарнитуры на H1 первого экрана это видимая поздняя подмена.
         `<link>` в разметке подхватывает preload-сканер браузера, и запрос уходит параллельно
         с таблицей стилей. `preconnect` к gstatic обязателен с `crossorigin` — файлы шрифтов
         запрашиваются в CORS-режиме.
         Manrope запрашивается как variable-шрифт одним диапазоном `wght@400..700` — это один
         файл вместо четырёх статических начертаний. У Prata один вес (400) и оси нет. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Prata&display=swap"
    />
    <!--
      Tells the browser this page implements both colour schemes itself. Without this, some
      mobile browsers (notably Chrome for Android's "force dark" / "darken web pages" setting)
      may invert what they consider an unthemed light page even after our own toggle sets it to
      light, which reads as "the switch does nothing". `color-scheme` is also declared per theme
      in index.css (`[data-theme] { color-scheme: ... }`); this meta tag is the document-level
      signal that applies before any CSS is parsed.
    -->
    <meta name="color-scheme" content="light dark" />
    <!-- Kept in sync with the active theme by `applyTheme` (src/shared/lib/theme.ts) on every
         toggle — colours the Android/iOS browser chrome (address bar, task switcher card) to
         match instead of leaving it on this default. -->
    <meta name="theme-color" content="#0f0c08" />
    <title>Hay Travel — Армения за пределами путеводителей</title>
    <!-- Static site-wide defaults for link-preview crawlers (Telegram, WhatsApp, iMessage,
         Facebook/Twitter cards) and search snippets. These were entirely missing before
         2026-08-16 — not even a fallback existed, so every shared link rendered with no
         title/description/image at all. This is deliberately the FAST fix: one fixed card for
         every URL on the site, not per-page content from the admin's SEO settings. The dynamic
         per-page version (title/description/OG image editable per tour/excursion, previously
         served by Netlify Edge Function `netlify/edge-functions/seo-meta.ts`) is tracked
         separately in `docs/tech-debt.md` — it needs an nginx `sub_filter`/SSR-style piece
         reviewed by `architect` before implementation, out of scope here. -->
    <meta name="description" content="Hay Travel — авторские туры и экскурсии по Армении: монастыри в ущельях, чёрный туф Гюмри, вино Арени, Севан на рассвете. Небольшие группы, местные гиды." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hay Travel" />
    <meta property="og:title" content="Hay Travel — Армения за пределами путеводителей" />
    <meta property="og:description" content="Авторские туры и экскурсии по Армении: монастыри в ущельях, чёрный туф Гюмри, вино Арени, Севан на рассвете. Небольшие группы, местные гиды." />
    <meta property="og:image" content="https://haytravel.duckdns.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://haytravel.duckdns.org/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hay Travel — Армения за пределами путеводителей" />
    <meta name="twitter:description" content="Авторские туры и экскурсии по Армении: монастыри в ущельях, чёрный туф Гюмри, вино Арени, Севан на рассвете." />
    <meta name="twitter:image" content="https://haytravel.duckdns.org/og-image.jpg" />
    <script>
      // Pre-paint theme: sets `data-theme` on <html> before the first frame, straight from
      // localStorage. Without this, the app rendered dark-by-default until React mounted and
      // ThemeToggle's effect ran — a visible flash to the wrong skin for anyone who had chosen
      // light, worse on slower mobile hardware. Deliberately plain, dependency-free JS (no
      // module import): it has to run synchronously, before the stylesheet/app bundle loads.
      // Values are duplicated from `src/shared/lib/theme.ts` (THEME_STORAGE_KEY, THEME_COLORS)
      // because that module cannot be imported here — keep both in sync if either changes.
      //
      // `/admin` is force-light, ignoring the stored preference entirely: the toggle only ever
      // renders in the public site's Header, but `data-theme` is a document-level attribute, so a
      // visitor who had switched the public site to dark earlier in the same browser would
      // otherwise open the admin panel — built entirely for a light shell — skinned in the public
      // site's dark "obsidian" palette. Checked here (not only in `AdminLayout`) so there is no
      // flash of the wrong theme before React mounts and the layout's own effect can run.
      //
      // The PALETTE PRESET (`data-preset`, Spec 006 / ADR 018) rides along for the same reason and
      // by the same means. The preset is chosen by the admin and only arrives over the network
      // (`GET SiteSettings/GetPublic?group=7`), i.e. principally after first paint — so the last
      // known value is cached in `localStorage` and re-applied here. The price is ONE flash of the
      // default palette on the visitor's very first visit in this browser (no cache yet), and
      // never again; the alternatives were either blocking first paint on a network round-trip or
      // that same flash on every single page load. Obsidian is the absence of the attribute.
      ;(function () {
        var isAdmin = location.pathname.indexOf('/admin') === 0
        // Дублирует THEME_COLORS из src/shared/lib/theme.ts — модуль сюда импортировать нельзя,
        // скрипт обязан отработать синхронно, до стилей и бандла. Новый пресет — строка и там, и тут.
        var COLORS = {
          obsidian: { dark: '#0f0c08', light: '#f7f1e6' },
          basalt: { dark: '#0e1214', light: '#edeeec' },
        }
        var root = document.documentElement
        try {
          // Приоритет тем же порядком, что в readStoredTheme(): выбор посетителя → серверный
          // дефолт → dark.
          var chosen = localStorage.getItem('hay-travel-theme')
          var fallback = localStorage.getItem('hay-travel-theme-default')
          var preferred =
            chosen === 'light' || chosen === 'dark' ? chosen : fallback === 'light' ? 'light' : 'dark'
          var theme = isAdmin ? 'light' : preferred

          // Тот же порядок, что в readCachedPalette(): личный выбор залогиненного →
          // закэшированный админский пресет → обсидиан. Два ключа, а не один, ровно по доводу из
          // shared/lib/palette.ts: иначе ответ GetPublic затирал бы личный выбор на каждой загрузке.
          var palette = localStorage.getItem('hay-travel-palette-choice')
          if (!COLORS[palette]) palette = localStorage.getItem('hay-travel-palette')
          if (!COLORS[palette]) palette = 'obsidian'

          root.dataset.theme = theme
          // Обсидиан = отсутствие атрибута. `/admin` не носит пресет никогда.
          if (!isAdmin && palette !== 'obsidian') root.dataset.preset = palette
          else delete root.dataset.preset

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', COLORS[isAdmin ? 'obsidian' : palette][theme])
        } catch (e) {
          root.dataset.theme = isAdmin ? 'light' : 'dark'
          delete root.dataset.preset
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
