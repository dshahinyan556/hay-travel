<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` lets the page draw under the iOS notch/Dynamic Island/home-indicator
         instead of Safari auto-reserving that space — required for `env(safe-area-inset-*)` to
         report real values anywhere in the app (Header's top padding, MobileTabBar's bottom
         padding). Without it those env() calls always resolve to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Tells the browser this page implements both colour schemes itself. Without this, some
      mobile browsers (notably Chrome for Android's "force dark" / "darken web pages" setting)
      may invert what they consider an unthemed light page even after our own toggle sets it to
      light, which reads as "the switch does nothing". `color-scheme` is also declared per theme
      in index.css (`[data-theme] { color-scheme: ... }`); this meta tag is the document-level
      signal that applies before any CSS is parsed.
    -->
    <meta name="color-scheme" content="light dark" />
    <!-- Kept in sync with the active theme by `applyTheme` (src/shared/lib/theme.ts) on every
         toggle — colours the Android/iOS browser chrome (address bar, task switcher card) to
         match instead of leaving it on this default. -->
    <meta name="theme-color" content="#0f0c08" />
    <title>Hay Travel</title>
    <script>
      // Pre-paint theme: sets `data-theme` on <html> before the first frame, straight from
      // localStorage. Without this, the app rendered dark-by-default until React mounted and
      // ThemeToggle's effect ran — a visible flash to the wrong skin for anyone who had chosen
      // light, worse on slower mobile hardware. Deliberately plain, dependency-free JS (no
      // module import): it has to run synchronously, before the stylesheet/app bundle loads.
      // Values are duplicated from `src/shared/lib/theme.ts` (THEME_STORAGE_KEY, THEME_COLORS)
      // because that module cannot be imported here — keep both in sync if either changes.
      //
      // `/admin` is force-light, ignoring the stored preference entirely: the toggle only ever
      // renders in the public site's Header, but `data-theme` is a document-level attribute, so a
      // visitor who had switched the public site to dark earlier in the same browser would
      // otherwise open the admin panel — built entirely for a light shell — skinned in the public
      // site's dark "obsidian" palette. Checked here (not only in `AdminLayout`) so there is no
      // flash of the wrong theme before React mounts and the layout's own effect can run.
      ;(function () {
        var isAdmin = location.pathname.indexOf('/admin') === 0
        try {
          var stored = localStorage.getItem('hay-travel-theme')
          var theme = isAdmin ? 'light' : stored === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f1e6' : '#0f0c08')
        } catch (e) {
          document.documentElement.dataset.theme = isAdmin ? 'light' : 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
